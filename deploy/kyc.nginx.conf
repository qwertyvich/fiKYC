# Only this virtual host belongs to fiKUS. Other vhosts stay unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name kyc.kraken892.rest;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kyc.kraken892.rest;
    root /opt/fikus-miniapp/current/dist;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/kyc.kraken892.rest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kyc.kraken892.rest/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 13m;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
