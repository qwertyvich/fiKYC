# Only this virtual host belongs to fiKUS. Other vhosts stay unchanged.
server {
    listen 80;
    server_name __FIKUS_HOST__;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fikus-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name __FIKUS_HOST__;
    root /opt/fikus-miniapp/current/dist;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/__FIKUS_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FIKUS_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FikusTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Fikus-Client-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 13m;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
