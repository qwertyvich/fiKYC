name: fikus
services:
  app:
    image: fikus-miniapp:${FIKUS_RELEASE:?Set release commit}
    build:
      context: ${FIKUS_RELEASE_DIR:?Set release directory}
      dockerfile: deploy/Dockerfile.runtime
    restart: unless-stopped
    init: true
    env_file: /opt/fikus-miniapp/shared/.env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - /opt/fikus-miniapp/shared/data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
